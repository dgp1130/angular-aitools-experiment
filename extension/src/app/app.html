<div id="heading">
    <h2>Ask me anything!</h2>
    <aside>(About this Angular app...)</aside>
</div>

<form action="#" (submit)="submit($event)">
    <textarea #prompt name="prompt" aria-label="Prompt"></textarea>

    <div>Suggested prompts:</div>
    <ul id="suggestions">
        @for (suggestion of suggestions; track $index) {
            <li>
                <button type="button" (click)="applySuggestion(suggestion)">
                    {{suggestion}}
                </button>
            </li>
        }
    </ul>

    <button type="submit" [disabled]="!analysis()">Submit</button>
</form>

<article><pre id="response">{{response()}}</pre></article>
